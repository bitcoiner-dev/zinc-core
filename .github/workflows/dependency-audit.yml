name: Dependency audit

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .cargo/config.toml
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .cargo/config.toml
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check advisories, licenses, sources, and dependency bans
        run: cargo deny check advisories licenses sources bans
