[package]
edition = "2021"
rust-version = "1.88"
name = "zinc-esplora-client"
version = "0.1.0"
authors = [
    "Alekos Filini <alekos.filini@gmail.com>",
    "Bitcoin Dev Kit Developers",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zinc-maintained Esplora client with shared pacing and bounded read extensions"
homepage = "https://github.com/bitcoindevkit/rust-esplora-client"
documentation = "https://docs.rs/zinc-esplora-client/"
readme = "README.md"
keywords = [
    "bitcoin",
    "esplora",
]
license = "MIT"
repository = "https://github.com/bitcoiner-dev/zinc-core"
include = ["src/**", "README.md", "ZINC-PATCH.md", "LICENSE"]

[features]
async = [
    "reqwest",
    "reqwest/socks",
    "tokio?/time",
]
async-https = [
    "async",
    "reqwest/default-tls",
]
async-https-native = [
    "async",
    "reqwest/native-tls",
]
async-https-rustls = [
    "async",
    "reqwest/rustls-tls",
]
async-https-rustls-manual-roots = [
    "async",
    "reqwest/rustls-tls-manual-roots",
]
blocking = [
    "minreq",
    "minreq/proxy",
]
blocking-https = [
    "blocking",
    "minreq/https",
]
blocking-https-bundled = [
    "blocking",
    "minreq/https-bundled",
]
blocking-https-native = [
    "blocking",
    "minreq/https-native",
]
blocking-https-rustls = [
    "blocking",
    "minreq/https-rustls",
]
default = [
    "blocking",
    "async",
    "async-https",
    "tokio",
]
tokio = ["dep:tokio"]

[lib]
test = false
name = "esplora_client"
path = "src/lib.rs"

[dependencies.bitcoin]
version = "0.32"
features = [
    "serde",
    "std",
]
default-features = false

[dependencies.futures-util]
version = "0.3"
default-features = false
features = ["std"]

[dependencies.hex]
version = "0.2"
package = "hex-conservative"

[dependencies.log]
version = "^0.4"

[dependencies.minreq]
version = "2.11.0"
features = ["json-using-serde"]
optional = true

[dependencies.reqwest]
version = "0.12"
features = ["json", "stream"]
optional = true
default-features = false

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
features = ["alloc"]
default-features = false

[dependencies.tokio]
version = "1"
features = ["time"]
optional = true

[dev-dependencies.electrsd]
version = "0.33.0"
features = [
    "legacy",
]

[dev-dependencies.lazy_static]
version = "1.4.0"

[dev-dependencies.tokio]
version = "1.20.1"
features = ["full"]
